name: Build and publish SavantRef

on:
  schedule:
    - cron: "17 */6 * 3-11 *"     # every 6 hours, March–November
    - cron: "17 9 * 12,1,2 *"     # once a day in the offseason
  workflow_dispatch:               # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site.json", "*.py", "templates/**", "static/**", "sw_template.js", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Downloaded Statcast / FanGraphs data is kept between runs, so only new days get downloaded.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: savantref-data-${{ github.run_id }}
          restore-keys: savantref-data-

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BUILD_WORKERS: "4"
        run: python build.py

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: savantref-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
